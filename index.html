<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENTRO Admin</title>
<style>
:root{--bg:#050507;--surface:#0b0b0e;--surface-2:#131317;--line:#1c1c1f;--text:#f5f5f7;--muted:#8a8a93;--gold:#d4af37;--teal:#14b8a6;--green:#22c55e;--red:#f43f5e}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.glow{position:fixed;top:-210px;left:50%;width:760px;height:760px;transform:translateX(-50%);background:radial-gradient(circle,rgba(20,184,166,.15),transparent 62%);filter:blur(54px);pointer-events:none}.login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.card{background:rgba(11,11,14,.91);border:1px solid var(--line);border-radius:24px;padding:48px 36px;max-width:420px;width:100%}.coin{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--gold);background:radial-gradient(circle at 30% 30%,#1a1a1d,#0b0b0d);border:1px solid rgba(212,175,55,.45)}.logo{font-weight:900;letter-spacing:2px;margin-bottom:18px}.logo span{color:var(--gold)}h1{font-size:26px;margin-bottom:10px}p{color:var(--muted);font-size:15px;line-height:1.8;margin-bottom:20px}input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:14px;margin-bottom:12px}button{width:100%;padding:14px;border-radius:12px;background:#5865f2;color:#fff;border:0;font-weight:900;cursor:pointer}.btn2{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}.app{display:none;max-width:1100px;margin:0 auto;padding:24px 16px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.out{color:var(--red);text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:8px}.section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}.section h2{font-size:17px;margin-bottom:12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{margin:0;flex:1;min-width:180px}.tools button{width:auto;padding:10px 16px}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pitem{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.pitem small{color:var(--muted);display:block}.pitem b{font-size:18px}.adj{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.adj input{width:120px;margin:0}.adj button{width:auto;padding:10px 14px}.green{color:var(--green)}.red{color:var(--red)}.tx{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;direction:ltr}.tx .ids{font-size:12px;color:var(--muted)}.tx .amount{font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}tbody tr{cursor:pointer;transition:.15s}tbody tr:hover{background:rgba(255,255,255,.04)}td.mono{direction:ltr;text-align:left;font-size:12px;color:var(--muted)}@media(max-width:760px){.profile{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="login" id="login"><div class="card"><div class="coin">ZC</div><div class="logo">ZENTRO<span> ADMIN</span></div><h1>لوحة الإدارة</h1><p>ادخل رابط API البوت وكلمة سر الإدارة.</p><input id="api" placeholder="رابط API البوت"><input id="pass" type="password" placeholder="كلمة سر الإدارة"><button onclick="login()">دخول</button><p id="err" style="color:var(--red);margin:10px 0 0"></p></div></div>
<div class="app" id="app">
<div class="topbar"><div class="brand">ZENTRO<span> ADMIN</span></div><div><button class="btn2" style="width:auto;padding:8px 14px;margin-left:8px" onclick="loadAll()">تحديث</button><a class="out" href="#" onclick="logout()">خروج</a></div></div>
<div class="grid">
<div class="stat"><small>الأعضاء</small><b id="sUsers">—</b></div>
<div class="stat"><small>السيرفرات</small><b id="sGuilds">—</b></div>
<div class="stat"><small>إجمالي العملات</small><b id="sCoins">—</b></div>
<div class="stat"><small>التحويلات</small><b id="sTx">—</b></div>
<div class="stat"><small>حالة البوت</small><b id="sBot">—</b></div>
</div>
<div class="section"><h2>بحث عن عضو</h2><div class="tools"><input id="uid" placeholder="User ID"><button onclick="loadProfile()">بحث</button></div><div id="profile"></div></div>
<div class="section"><h2>كل الأعضاء</h2><div class="tools"><input id="msearch" placeholder="ابحث بالـ User ID..." oninput="memberSearch()"><button class="btn2" onclick="loadMembers()">تحديث القائمة</button></div><div id="members"></div></div>
<div class="section"><h2>تحويلات السيرفر كلها</h2><div class="tools"><button class="btn2" onclick="loadTx()">تحديث التحويلات</button></div><div id="txs"></div></div>
</div>
<script>
const fmt=n=>Number(n||0).toLocaleString('en-US');
const fdate=d=>new Date(d).toLocaleString('en-GB');
let API=localStorage.getItem('api')||'';let TOKEN=localStorage.getItem('token')||'';
if(API&&TOKEN){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadAll()}
async function login(){API=document.getElementById('api').value.trim().replace(/\/$/,'');const pass=document.getElementById('pass').value;document.getElementById('err').textContent='';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});const d=await r.json();if(!r.ok)throw new Error(d.error||'login failed');TOKEN=d.token;localStorage.setItem('api',API);localStorage.setItem('token',TOKEN);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadAll()}catch(e){document.getElementById('err').textContent=e.message}}
function logout(){localStorage.removeItem('token');location.reload()}
function h(){return{Authorization:'Bearer '+TOKEN}}
async function loadAll(){loadStats();loadTx();loadMembers()}
async function loadStats(){try{const d=await(await fetch(API+'/api/stats')).json();document.getElementById('sUsers').textContent=fmt(d.users);document.getElementById('sGuilds').textContent=fmt(d.guilds);document.getElementById('sCoins').textContent=fmt(d.totalCoins);document.getElementById('sTx').textContent=fmt(d.transfers);document.getElementById('sBot').textContent=d.botStatus}catch(e){}}
let memberTimer;
function memberSearch(){clearTimeout(memberTimer);memberTimer=setTimeout(loadMembers,300)}
async function loadMembers(){const box=document.getElementById('members');const q=document.getElementById('msearch').value.trim();try{const d=await(await fetch(API+'/api/admin/users?search='+encodeURIComponent(q),{headers:h()})).json();const users=d.users||[];if(!users.length){box.innerHTML='<p style="color:var(--muted)">لا يوجد أعضاء.</p>';return}box.innerHTML='<table><thead><tr><th>User ID</th><th>المحفظة</th><th>البنك</th><th>الإجمالي</th></tr></thead><tbody>'+users.map(u=>`<tr onclick="openUser('${u.user_id}')"><td class="mono">${u.user_id}</td><td>${fmt(u.balance)} ZC</td><td>${fmt(u.bank)} ZC</td><td class="gold">${fmt(u.total)} ZC</td></tr>`).join('')+'</tbody></table>'}catch(e){box.innerHTML='<p style="color:var(--red)">تعذر تحميل الأعضاء.</p>'}}
function openUser(id){document.getElementById('uid').value=id;loadProfile();document.getElementById('profile').scrollIntoView({behavior:'smooth'})}
async function loadProfile(){const id=document.getElementById('uid').value.trim();const box=document.getElementById('profile');if(!id){box.innerHTML='';return}try{const u=await(await fetch(API+'/api/user/'+id,{headers:h()})).json();if(u.error){box.innerHTML='<p style="color:var(--red)">'+u.error+'</p>';return}box.innerHTML=`
<div class="profile">
<div class="pitem"><small>المحفظة</small><b>${fmt(u.balance)} ZC</b></div>
<div class="pitem"><small>البنك</small><b>${fmt(u.bank)} ZC</b></div>
<div class="pitem"><small>الإجمالي</small><b>${fmt(u.totalCoins)} ZC</b></div>
<div class="pitem"><small>XP</small><b>${fmt(u.xp)}</b></div>
<div class="pitem"><small>الترتيب</small><b>#${u.wealthRank||'—'}</b></div>
<div class="pitem"><small>تحويلاته</small><b>${fmt(u.transfersTotal)}</b></div>
</div>
<div class="adj"><input id="amt" placeholder="المبلغ"><button onclick="adjust('${id}','wallet',1)">+ محفظة</button><button class="btn2" onclick="adjust('${id}','wallet',-1)">- محفظة</button><button onclick="adjust('${id}','bank',1)">+ بنك</button><button class="btn2" onclick="adjust('${id}','bank',-1)">- بنك</button><button class="btn2" onclick="setExact('${id}','wallet',${u.balance})">تعيين المحفظة بالظبط</button><button class="btn2" onclick="setExact('${id}','bank',${u.bank})">تعيين البنك بالظبط</button><button class="btn2" onclick="resetDaily('${id}')">تصفير الديلي</button><button class="btn2" onclick="copyId('${id}')">نسخ ID</button></div>
<div id="txUser" style="margin-top:14px"></div>`;loadUserTx(id)}catch(e){box.innerHTML='<p style="color:var(--red)">تعذر جلب البيانات</p>'}}
async function loadUserTx(id){try{const d=await(await fetch(API+'/api/transactions/'+id,{headers:h()})).json();const box=document.getElementById('txUser');box.innerHTML='<h3 style="margin-bottom:8px">آخر تحويلاته</h3>'+((d.transactions||[]).map(t=>`<div class="tx"><div><div class="ids">${t.sender_id} → ${t.receiver_id}</div><div class="ids">${fdate(t.created_at)}</div></div><div class="amount">${fmt(t.amount)} ZC</div></div>`).join('')||'<p style="color:var(--muted)">لا توجد تحويلات.</p>')}catch(e){}}
async function adjust(id,type,sign){const amount=parseInt(document.getElementById('amt').value);if(!amount)return confirm('المبلغ غير صحيح');if(!confirm((sign>0?'إضافة ':'خصم ')+amount+' ZC '+(type==='bank'?'من البنك':'من المحفظة')+' للعضو '+id+'؟'))return;try{const r=await fetch(API+'/api/admin/adjust'+(type==='bank'?'-bank':''),{method:'POST',headers:{'Content-Type':'application/json',...h()},body:JSON.stringify({user_id:id,amount:amount*sign})});const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل');alert('تم بنجاح');loadProfile();loadStats();loadMembers()}catch(e){alert(e.message)}}
async function setExact(id,type,current){const target=parseInt(prompt('اكتب الرقم المطلوب بالظبط:',current));if(isNaN(target)||target<0)return;const delta=target-current;if(!delta)return alert('القيمة نفسها');if(!confirm('تعيين '+(type==='bank'?'البنك':'المحفظة')+' إلى '+target+' ZC للعضو '+id+'؟'))return;try{const r=await fetch(API+'/api/admin/adjust'+(type==='bank'?'-bank':''),{method:'POST',headers:{'Content-Type':'application/json',...h()},body:JSON.stringify({user_id:id,amount:delta})});const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل');alert('تم بنجاح');loadProfile();loadStats();loadMembers()}catch(e){alert(e.message)}}
async function resetDaily(id){if(!confirm('تصفير الديلي للعضو '+id+'؟ هيقدر يستلم /daily تاني فورًا.'))return;try{const r=await fetch(API+'/api/admin/reset-daily',{method:'POST',headers:{'Content-Type':'application/json',...h()},body:JSON.stringify({user_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'فشل');alert('تم تصفير الديلي بنجاح')}catch(e){alert(e.message)}}
function copyId(id){navigator.clipboard.writeText(id).then(()=>alert('تم نسخ الـ ID')).catch(()=>{})}
async function loadTx(){try{const d=await(await fetch(API+'/api/admin/transactions?limit=100',{headers:h()})).json();const box=document.getElementById('txs');box.innerHTML=(d.transactions||[]).map(t=>`<div class="tx"><div><div class="ids">${t.sender_id} → ${t.receiver_id}</div><div class="ids">${fdate(t.created_at)}</div></div><div class="amount">${fmt(t.amount)} ZC</div></div>`).join('')||'<p style="color:var(--muted)">لا توجد تحويلات.</p>'}catch(e){}}
setInterval(()=>{if(document.getElementById('app').style.display==='block'){loadStats();loadTx();loadMembers()}},10000);
</script>
</body>
</html>
